<section class="news" aria-labelledby="news-title">
  <div class="news-header">
    <h2 id="news-title">Actualités récentes</h2>
    <a class="all-news-link" href="#" aria-disabled="true" title="Bientôt disponible">
      Voir toutes les actualités
      <span aria-hidden="true">→</span>
    </a>
  </div>

  <div class="news-grid">
    @for (item of news; track item.image) {
      <article class="news-card">
        <img [src]="item.image" [alt]="item.alt" width="1536" height="1024" loading="eager" decoding="async">
        <p class="news-date">{{ item.date }}</p>
        <h3>{{ item.title }}</h3>
        <p class="news-location">{{ item.location }}</p>
        <a class="read-more" href="#" aria-disabled="true" title="Bientôt disponible">
          Lire la suite
          <span aria-hidden="true">→</span>
        </a>
      </article>
    }
  </div>
</section>
