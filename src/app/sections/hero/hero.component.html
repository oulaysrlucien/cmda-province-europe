<section class="hero" [class.event-slide]="activeSlide === 1" aria-labelledby="hero-title"
  (mouseenter)="pauseAutoplay()" (mouseleave)="resumeAutoplay()"
  (focusin)="pauseAutoplay()" (focusout)="resumeAutoplay()">
  <img class="hero-image" [src]="slides[activeSlide].image" [alt]="slides[activeSlide].alt"
    width="2172" height="724" fetchpriority="high">
  <div class="hero-inner">
    <div class="hero-content">
      <p class="hero-eyebrow">{{ slides[activeSlide].eyebrow }}</p>
      <h1 id="hero-title" aria-live="polite">
        @for (line of slides[activeSlide].title; track line) {
          <span>{{ line }}</span>
        }
      </h1>
      <p>{{ slides[activeSlide].description }}</p>
      <!-- Les destinations seront raccordées lorsque les sections seront disponibles. -->
      <div class="hero-actions">
        <a class="hero-button primary" href="#bienvenue">
          Découvrir la CMDA
        </a>
        <button class="hero-button secondary" type="button" aria-disabled="true" title="Bientôt disponible">
          Notre mission
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
            <path d="M3 1.5 10 6 3 10.5Z" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="hero-controls" aria-label="Navigation du carrousel">
    <button class="hero-control" type="button" aria-label="Image précédente" (click)="previousSlide()">‹</button>
    <div class="hero-dots">
      @for (slide of slides; track slide.image; let index = $index) {
        <button class="hero-dot" type="button" [class.is-active]="index === activeSlide"
          [attr.aria-label]="'Afficher la diapositive ' + (index + 1)" [attr.aria-current]="index === activeSlide ? 'true' : null"
          (click)="selectSlide(index)"></button>
      }
    </div>
    <button class="hero-control" type="button" aria-label="Image suivante" (click)="nextSlide()">›</button>
  </div>
</section>
