<header class="site-header" (keydown.escape)="closeMenus(); menuToggle.focus()">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="CMDA — Accueil" (click)="closeMenus()">
      <img class="brand-logo" src="assets/images/logo-cmda.png" alt="" width="260" height="363">
      <span class="brand-name">
        <span class="brand-community">Communauté catholique</span>
        <span class="brand-title">Mère du Divin Amour</span>
        <span class="brand-short">CMDA <span class="province-label">- Province Europe</span></span>
      </span>
    </a>
    <button #menuToggle class="menu-toggle" type="button" aria-controls="header-navigation"
      [attr.aria-expanded]="menuOpen" [attr.aria-label]="menuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        @if (menuOpen) { <path d="m6 6 12 12M6 18 18 6" /> }
        @else { <path d="M3 6h18M3 12h18M3 18h18" /> }
      </svg>
    </button>
    <nav id="header-navigation" class="navigation" [class.is-open]="menuOpen" aria-label="Navigation principale">
      <a class="nav-link" routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" (click)="closeMenus()">Accueil</a>
      @for (label of navigation; track label) {
        @if (label === 'Régions') {
          <div class="regions-dropdown" routerLinkActive="region-active"
            (focusout)="closeRegionsOnFocusLeave($event, regionMenu)"
            (keydown.escape)="$event.stopPropagation(); regionsOpen = false; regionsToggle.focus()" #regionMenu>
            <button #regionsToggle class="nav-link regions-toggle" type="button" aria-controls="regions-submenu"
              [attr.aria-expanded]="regionsOpen" (click)="regionsOpen = !regionsOpen">
              Régions
              <svg class="chevron" [class.expanded]="regionsOpen" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="m3.5 6 4.5 4 4.5-4" />
              </svg>
            </button>
            <div id="regions-submenu" class="regions-submenu" [hidden]="!regionsOpen">
              <a routerLink="/regions/nord" routerLinkActive="selected" ariaCurrentWhenActive="page" (click)="closeMenus()">Région Nord</a>
              <a routerLink="/regions/sud" routerLinkActive="selected" ariaCurrentWhenActive="page" (click)="closeMenus()">Région Sud</a>
            </div>
          </div>
        } @else {
          <a class="nav-link" role="link" aria-disabled="true" title="Bientôt disponible">{{ label }}</a>
        }
      }
      <button class="donate-button" type="button" aria-disabled="true" title="Bientôt disponible">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
        </svg>
        Faire un don
      </button>
    </nav>
  </div>
</header>
